# 开发环境依赖：MySQL 8 + Redis 7
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: tiangong-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: tiangong123
      MYSQL_DATABASE: tiangong_erp
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    container_name: tiangong-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # AOF 每秒持久化：防引擎崩溃后单号序列回退撞号
    command: redis-server --appendonly yes --appendfsync everysec

volumes:
  mysql-data:
  redis-data:
